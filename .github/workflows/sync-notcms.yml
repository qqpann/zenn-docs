name: Sync NotCMS to Zenn

on:
  schedule:
    - cron: "0 */3 * * *" # 3時間ごと
  workflow_dispatch:
  repository_dispatch:
    types: [sync_zenn]

concurrency:
  group: sync-notcms
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Notion の techblog を articles/<slug>.md に書き出し、main に直接コミットする。
      # slug が空のページはスキップされる。
      - uses: qqpann/notcms/sync-action@v0
        with:
          direction: pull
          workspace_id: ${{ secrets.NOTCMS_WORKSPACE_ID }}
          secret_key: ${{ secrets.NOTCMS_SECRET_KEY }}
          file_path: "articles/{slug}.md"
          on_change: commit
